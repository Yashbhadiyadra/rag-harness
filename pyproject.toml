[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-harness"
version = "0.9.0"
description = "Reliability-first RAG system over Kubernetes documentation"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.30",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "gitpython>=3.1",
    "tiktoken>=0.7",
    "rank_bm25>=0.2.2",
    "prometheus_client>=0.20",
    "opentelemetry-api>=1.20",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
eval = [
    "openai>=1.30",   # LLM-as-judge; kept separate so eval doesn't run on every PR
]
rerank = [
    # sentence-transformers 4.x/5.x pull transformers 5.x, which shipped a
    # `nn.Module` type annotation without importing `torch.nn as nn`, breaking
    # `from sentence_transformers import CrossEncoder`. Pin to the 3.x line
    # (transitively pulls transformers 4.x, which works).
    "sentence-transformers>=3.0,<4.0",  # cross-encoder reranker; ~500MB with PyTorch
    # torch 2.2.2 (transitive dep of sentence-transformers 3.x) was compiled
    # against NumPy 1.x. NumPy 2.x breaks torch.Tensor→numpy round-trips at
    # runtime with a "Numpy is not available" error. Pin NumPy < 2 until we
    # upgrade to torch >= 2.4 (which supports NumPy 2).
    "numpy<2.0",
]
observability = [
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "opentelemetry-sdk>=1.20",  # needed for tests with InMemorySpanExporter
]

[project.urls]
Homepage = "https://github.com/Yashbhadiyadra/rag-harness"
Repository = "https://github.com/Yashbhadiyadra/rag-harness"
Issues = "https://github.com/Yashbhadiyadra/rag-harness/issues"
Changelog = "https://github.com/Yashbhadiyadra/rag-harness/blob/main/CHANGELOG.md"

[project.scripts]
rag-harness = "rag_harness.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "rank_bm25",
    "sentence_transformers",
    "phoenix.*",
    "openinference.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end pipeline tests; require a real index. Run with: pytest -m integration",
]
