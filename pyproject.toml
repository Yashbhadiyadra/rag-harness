[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-harness"
version = "0.1.0"
description = "Reliability-first RAG system over Kubernetes documentation"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.30",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "gitpython>=3.1",
    "tiktoken>=0.7",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
eval = [
    "openai>=1.30",   # LLM-as-judge; kept separate so eval doesn't run on every PR
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[project.scripts]
rag-harness = "rag_harness.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end pipeline tests; require a real index. Run with: pytest -m integration",
]
