# Regenerate docs/metrics/index.html after the nightly eval completes.
# Also triggerable manually so a metrics-page CSS/layout tweak can be
# published without waiting for the nightly (or paying for a full eval).
#
# Runs against main. Commits with [skip ci] so the follow-up push does
# not trigger the CI workflow — the file's only inputs are runs.jsonl
# and the generator, both of which are already tested.

name: Regenerate metrics page

on:
  workflow_run:
    workflows: ["Nightly Eval"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # push the regenerated file

jobs:
  regenerate:
    # Only regenerate if the nightly eval succeeded (or if manually dispatched).
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Create virtual environment
        run: uv venv .venv --python 3.12
      - name: Install dependencies
        run: uv pip install -e "."

      - name: Regenerate metrics page
        run: uv run --no-sync python -m scripts.render_metrics_page

      - name: Commit if changed
        run: |
          if [[ -z $(git status --porcelain docs/metrics/index.html) ]]; then
            echo "No changes to docs/metrics/index.html — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/index.html
          git commit -m "chore(metrics): regenerate metrics page [skip ci]"
          git push
