name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv .venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run checks
        run: make check

  security:
    name: Secret + dep-vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history, not just the current tree.
          fetch-depth: 0

      - name: gitleaks — full-history secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv .venv --python 3.12

      - name: Install runtime deps + pip-audit
        # Runtime deps only (no [dev]) so the audit reports what's actually
        # shipped, and pip-audit itself.
        run: uv pip install -e "." pip-audit

      - name: pip-audit — dependency vulnerability scan
        # --strict fails on any known-vulnerable install. --disable-pip keeps
        # the audit off the network path so a transient PyPI outage does not
        # false-fail CI.
        run: uv run --no-sync pip-audit --strict --disable-pip
